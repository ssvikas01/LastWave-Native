name: Build LastWave APK

on:
  push:
    branches: [ main, master, vikas-music-custom ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore release.keystore -alias release_key -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=VikasMusic,O=Vikas,C=US"
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: release_key
          RELEASE_KEY_PASSWORD: android
        run: ./gradlew assembleRelease -PvivoOrigin=true --stacktrace

      - name: Stage Final APK
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="5.2.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building APK for Vikas Music (iQOO Z9x / OriginOS 6) v$VERSION"
          APK_FILE=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" final_apk/VikasMusic-v${VERSION}-OriginOS6.apk
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -n "$APKSIGNER" ]; then
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" || echo "Signature verified"
            done
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VikasMusic-v${{ steps.prep_apk.outputs.version }}-OriginOS6-APK
          path: final_apk/*
          if-no-files-found: error